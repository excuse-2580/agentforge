<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#181a21">
  <meta name="description" content="智能体管家 · AgentForge - Material You 设计的 AI 智能体管理器，支持本地模型与 QQ 接入">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AgentForge">

  <title>智能体管家 · AgentForge</title>

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg">
  <link rel="apple-touch-icon" href="assets/icon-192.png">

  <!-- Material Symbols（Outline，按需子集化） -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600&family=Roboto+Mono&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">

  <script>
    // 注册 Service Worker（PWA 离线支持）
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => { /* 忽略注册失败 */ });
      });
    }
  </script>
</head>
<body>
  <div id="app"></div>

  <!-- 通用对话框 / Snackbar 挂载点 -->
  <div id="overlay-root"></div>

  <script src="js/storage.js"></script>
  <script src="js/llm.js"></script>
  <script src="js/qq.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
  <script>
    // 首次访问载入示例智能体（如果为空）
    (function seed() {
      if (Storage.loadAgents().length === 0) {
        Storage.createAgent({
          name: '小夜',
          avatar: '🐺',
          summary: '一只巧克力味的小狼，温柔又有点玻璃心',
          systemPrompt: '你是小夜，一只巧克力味的小狼，温柔善良但有点玻璃心。说话可爱、友善，喜欢和主人聊天。',
          greeting: '呜汪～你好呀！我是小夜，一只巧克力味的小狼，很高兴认识你！🍫🐾',
          tags: ['Furry', '助手', '示例'],
          model: { provider: 'ollama', baseUrl: 'http://localhost:11434/v1', modelName: 'llama3.2:3b', temperature: 0.8, maxTokens: 1024, topP: 1, stream: true },
        });
      }
    })();
  </script>
</body>
</html>
